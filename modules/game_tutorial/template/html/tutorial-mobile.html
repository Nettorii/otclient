<style>
    .mobileTutorialContent {
        width: 620px;
        height: 660px;
        display: block;
        position: relative;
        background-color: alpha;
    }
    .mobileWelcomeStep {
        width: 100%;
        height: 220px;
        position: relative;
        padding: 8px;
        background-color: #101c29ee;
        --border-width: 1;
        --border-color: #52687a66;
    }
    .mobileWelcomeImage {
        width: 360px;
        height: 140px;
        position: absolute;
        top: 4px;
        left: 4px;
        pointer-events: none;
    }
    .mobileWelcomeText {
        position: absolute;
        top: 16px;
        left: 376px;
        right: 8px;
        height: 96px;
        color: #cbd7e1;
        white-space: pre-wrap;
        --text-wrap: true;
    }
    .vocationSelectionList {
        width: 100%;
        height: 640px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .vocationSelectionCard {
        width: 100%;
        height: 120px;
        position: relative;
        padding: 8px;
        background-color: #101c29ee;
        --border-width: 1;
        --border-color: #52687a66;
    }
    .mobileVocationTitle {
        position: absolute;
        top: 8px;
        left: 10px;
        width: 150px;
        height: 24px;
        color: #edf3f8;
        font: verdana-11px-antialised;
    }
    .mobileVocationRole {
        position: absolute;
        top: 34px;
        left: 10px;
        width: 170px;
        height: 22px;
        color: #9fb1c1;
    }
    .mobileVocationSpecialties {
        position: absolute;
        top: 58px;
        left: 10px;
        right: 148px;
        height: 50px;
        color: #c4d0da;
        white-space: pre-wrap;
        --text-wrap: true;
    }
    .vocationDetailsContent {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
    }
    .selectionActionButtonContainer, .confirmationButtonContainer {
        width: 132px;
        height: 48px;
        position: absolute;
        right: 8px;
        bottom: 8px;
    }
    .actionButton {
        width: 132px;
        height: 48px;
        color: #ffffff;
        font: verdana-11px-antialised;
        text-align: center;
        background-color: #1d3448ee;
        --border-width: 1;
        --border-color: #7891a477;
    }
    .actionButton:hover { background-color: #294962; }
    .vocationSelectionHighlight {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        --border-width: 2;
        --border-color: #6da7d1;
    }
    .mobileJourneyAction {
        width: 160px;
        height: 48px;
        position: absolute;
        right: 8px;
        bottom: 8px;
    }
</style>

<html>
<div id="tutorialSelectionWindow" class="mobileTutorialContent">
    <div class="vocationSelectionList" *if="self.tutorialStep == 0">
        <div class="vocationSelectionCard" *for="local vocation in self.vocations"
             *for-finished="self:onVocationCardsRendered()" *vocation="vocation">
            <label class="mobileVocationTitle" *text="vocation.name"></label>
            <label class="mobileVocationRole" *text="vocation.role"></label>
            <label class="mobileVocationSpecialties" *text="vocation.specialties"></label>
            <div class="vocationDetailsContent"></div>
            <div class="selectionActionButtonContainer">
                <button class="actionButton" *text="'Select ' .. vocation.name"
                        onclick="self:selectVocation(vocation.id)"></button>
            </div>
            <div class="confirmationButtonContainer">
                <button class="actionButton" text="Confirm"
                        onclick="self:confirmVocation()"></button>
            </div>
            <div class="vocationSelectionHighlight"></div>
        </div>
    </div>

    <div class="mobileWelcomeStep" *if="self.tutorialStep == 2">
        <img class="mobileWelcomeImage QtBorder"
             src="/game_tutorial/assets/images/backdrop_popup_welcometotibia" />
        <label class="mobileWelcomeText"
               text="Welcome to Beginner Island. Learn the basics, then choose the vocation that matches your play style."></label>
        <button class="actionButton mobileJourneyAction" text="Journey On"
                onclick="self:continueTutorial()"></button>
    </div>
</div>
</html>
